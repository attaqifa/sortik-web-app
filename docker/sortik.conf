# Situs Apache SORTIK untuk kontainer produksi (lihat Dockerfile).
# public/ disajikan apa adanya; /api/* diteruskan ke router PHP di backend/public/index.php.
# ${PORT} dibaca dari environment (Render mengisinya; bawaan 10000 dari Dockerfile).

ServerName localhost
ServerTokens Prod
ServerSignature Off

# Tiap proses mod_php memakan ±20–40 MB; batasi agar instans kecil (mis. 512 MB) tidak kehabisan memori.
# Permintaan berlebih menunggu di antrean, bukan membuat proses baru.
<IfModule mpm_prefork_module>
    StartServers          2
    MinSpareServers       2
    MaxSpareServers       4
    MaxRequestWorkers     10
    MaxConnectionsPerChild 1000
</IfModule>
Timeout 30
KeepAliveTimeout 5

<VirtualHost *:${PORT}>
    DocumentRoot /app/public

    <Directory />
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /app/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # hanya titik masuk API yang boleh dijalankan dari backend/
    <Directory /app/backend/public>
        Options None
        AllowOverride None
        Require all denied
        <Files "index.php">
            Require all granted
        </Files>
    </Directory>

    # berkas tersembunyi (.env, .git, …) tidak pernah disajikan
    <LocationMatch "/\.">
        Require all denied
    </LocationMatch>

    RewriteEngine On
    RewriteRule ^/api(/.*)?$ /app/backend/public/index.php [L]

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
