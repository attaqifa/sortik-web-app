<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <title>Beranda Admin — SORTIK</title>
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<div class="app">

  <aside class="side" id="side"></aside>

  <main>
    <header class="head">
      <h1>Beranda Admin</h1>
      <p>Ringkasan penjualan dan pengawasan data toko</p>
    </header>

    <section class="hello">
      <div>
        <p>Selamat bertugas 👋</p>
        <h2 id="nama"></h2>
      </div>
      <div class="acts">
        <a href="pengguna.html">Kelola Pengguna</a>
        <a href="pengaturan.html">Pengaturan Toko</a>
      </div>
    </section>

    <section class="stats" id="stats"></section>

    <section class="card">
      <h2>Perlu Tindakan</h2>
      <div class="tindakanlist" id="tindakan"></div>
    </section>

    <!-- grafik penghasilan: diisi assets/js/admin/beranda.js -->
    <section class="card">
      <h2>Grafik Penghasilan
        <select id="rentang" class="chartsaring" aria-label="Rentang grafik">
          <option value="6">6 bulan terakhir</option>
          <option value="12">12 bulan terakhir</option>
        </select>
      </h2>
      <div class="chart" id="grafik"></div>
      <p class="hasil" id="grafikInfo"></p>
      <div class="legend">
        <span><i class="dibayar"></i> Sudah dibayar</span>
        <span><i class="belumdibayar"></i> Belum dibayar</span>
      </div>
    </section>

    <!-- laporan: diisi assets/js/admin/beranda.js -->
    <section class="card">
      <h2>Penjualan per Bulan <a href="pesanan.html">Kelola Pesanan</a></h2>
      <p class="hasil" id="total"></p>
      <div id="lapor"></div>
    </section>

    <section class="card">
      <h2>Produk Terlaris <a href="produk.html">Kelola Barang</a></h2>
      <div id="laris"></div>
    </section>

    <section class="card">
      <h2>Pesanan Belum Dibayar <a href="pesanan.html">Tandai Dibayar</a></h2>
      <div id="belum"></div>
    </section>
  </main>

</div>
<script src="../assets/js/core/data.js"></script>
<script src="../assets/js/core/ui.js"></script>
<script src="../assets/js/core/store.js"></script>
<script src="../assets/js/core/kelola.js"></script>
<script src="../assets/js/admin/beranda.js"></script>
</body>
</html>
