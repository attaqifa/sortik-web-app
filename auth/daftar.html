<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <title>Daftar — SORTIK</title>
  <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body>
<main class="wrap">

  <aside class="promo">
    <div class="brand">
      <h1>SORTIK</h1>
      <p>Sistem Sortir &amp; Katalog Elektronik</p>
    </div>

    <div class="hero">
      <h2>Iki lo <span>barang</span> e!</h2>
      <p>Temukan produk lebih cepat, kelola rak lebih rapi, dan pantau operasional toko dalam satu sistem terpadu.</p>
    </div>

    <footer><b>Tim Rak</b><br>Development</footer>
  </aside>

  <section class="form">
    <h2>Buat akun baru</h2>
    <p>Daftar sebagai Pembeli — gratis, cukup satu menit.</p>

    <form method="post" action="#">
      <input type="hidden" name="role" value="pembeli">

      <label for="nama">Nama Lengkap</label>
      <input type="text" id="nama" name="nama" required placeholder="Masukkan nama lengkap...">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="Masukkan email...">

      <label for="password">Kata Sandi</label>
      <div class="sandi">
        <input type="password" id="password" name="password" minlength="8" required placeholder="Masukkan kata sandi...">
        <button type="button" class="lihat" aria-label="Lihat kata sandi"><span class="ikon terbuka" data-lucide="eye"></span><span class="ikon tertutup" data-lucide="eye-off"></span></button>
      </div>

      <label for="konfirmasi">Ulangi Kata Sandi</label>
      <input type="password" id="konfirmasi" name="konfirmasi" minlength="8" required placeholder="Masukkan ulang kata sandi..." autocomplete="new-password">

      <button type="submit">Daftar</button>
    </form>

    <p class="switch">Sudah punya akun? <a href="login.html">Masuk</a></p>
  </section>

</main>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../assets/js/login.js"></script>
</body>
</html>
