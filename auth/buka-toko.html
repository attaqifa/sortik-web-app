<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="../assets/img/SortikLogo.jpeg">
  <title>Punya Toko · SORTIK</title>
  <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body>
<main class="wrap">

  <aside class="promo">
    <div class="brand">
      <img class="brandlogo" src="../assets/img/SortikLogo.jpeg" alt="Logo SORTIK">
      <h1>SORTIK</h1>
      <p>Sistem Sortir &amp; Katalog Elektronik untuk Toko</p>
    </div>

    <div class="hero">
      <h2>Punya toko? <span>Gabung</span> timnya.</h2>
      <p>Daftar sebagai admin untuk membuka dan mengelola toko sendiri.</p>
    </div>
  </aside>

  <section class="form">
    <h2>Punya Toko</h2>

    <div class="modetabs" role="tablist" aria-label="Pilih kegiatan">
      <button type="button" role="tab" data-mode="daftar" class="on" aria-selected="true">Daftar</button>
      <button type="button" role="tab" data-mode="masuk" aria-selected="false">Masuk</button>
    </div>

    <div id="modeDaftar">
      <form id="form-daftar-peran" method="post" action="#" data-peran="admin">
        <label for="d-nama">Nama Lengkap</label>
        <input type="text" id="d-nama" name="nama" required placeholder="Masukkan nama lengkap...">

        <label for="d-email">Email</label>
        <input type="email" id="d-email" name="email" required placeholder="Email untuk masuk...">

        <label for="d-password">Kata Sandi</label>
        <div class="sandi">
          <input type="password" id="d-password" name="password" minlength="8" required placeholder="Minimal 8 karakter..." autocomplete="new-password">
          <button type="button" class="lihat" aria-label="Lihat kata sandi"><span class="ikon terbuka" data-lucide="eye"></span><span class="ikon tertutup" data-lucide="eye-off"></span></button>
        </div>

        <label for="konfirmasi">Ulangi Kata Sandi</label>
        <input type="password" id="konfirmasi" name="konfirmasi" minlength="8" required placeholder="Masukkan ulang kata sandi..." autocomplete="new-password">

        <button type="submit">Daftar</button>
        <p class="galat" hidden></p>
      </form>
    </div>

    <div id="modeMasuk" hidden>
      <form id="form-masuk-peran" method="post" action="#">
        <div class="roles dua">
          <input type="radio" name="role" id="m-admin" value="admin" checked>
          <label for="m-admin"><span class="ikon" data-lucide="store"></span><span>Admin Toko</span></label>

          <input type="radio" name="role" id="m-staff" value="staff">
          <label for="m-staff"><span class="ikon" data-lucide="package"></span><span>Staff Toko</span></label>
        </div>

        <label for="m-email">Email</label>
        <input type="email" id="m-email" name="email" required placeholder="Masukkan email...">

        <label for="m-password">Kata Sandi</label>
        <div class="sandi">
          <input type="password" id="m-password" name="password" required placeholder="Masukkan kata sandi...">
          <button type="button" class="lihat" aria-label="Lihat kata sandi"><span class="ikon terbuka" data-lucide="eye"></span><span class="ikon tertutup" data-lucide="eye-off"></span></button>
        </div>

        <button type="submit">Masuk</button>
        <p class="galat" hidden></p>
      </form>
    </div>

    <p class="switch">Ingin belanja sebagai pembeli? <a href="daftar.html">Daftar Pembeli</a> · <a href="login.html">Masuk di halaman Masuk</a></p>
  </section>

</main>
<script src="../assets/vendor/lucide.min.js"></script>
<script src="../assets/js/core/koneksi.js"></script>
<script src="../assets/js/login.js"></script>
</body>
</html>
