<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesan &amp; Booking — SORTIK</title>
  <link rel="stylesheet" href="../assets/css/user.css">
</head>
<body>
<div class="app">

  <!-- sidebar (logo, menu, user) diisi app.js -->
  <aside class="side" id="side"></aside>

  <main>
    <header class="head">
      <h1>Pesan &amp; Booking</h1>
      <p>Kelola semua booking dan pesanan Anda</p>
    </header>

    <!-- daftar pesanan: chip status + baris (diisi pesan.js) -->
    <section class="card" id="daftar">
      <div class="chips" id="chips"></div>
      <div id="list"></div>
    </section>

    <!-- detail satu pesanan, dibuka dari baris di atas -->
    <section class="card" id="detail" hidden></section>
  </main>

</div>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/pesan.js"></script>
</body>
</html>
