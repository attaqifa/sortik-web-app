<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cari Produk &amp; Rak — SORTIK</title>
  <link rel="stylesheet" href="../assets/css/user.css">
</head>
<body>
<div class="app">

  <!-- sidebar (logo, menu, user) diisi app.js -->
  <aside class="side" id="side"></aside>

  <main>
    <header class="head">
      <h1>Cari Produk &amp; Rak</h1>
      <p>Temukan produk dan lokasi raknya</p>
    </header>

    <section class="card cari">
      <input type="search" id="q" placeholder="Cari produk..." autocomplete="off">
      <div class="chips" id="chips"></div>

      <details open>
        <summary>Denah Rak Toko</summary>
        <div class="rak" id="denah"></div>
      </details>
    </section>

    <p class="hasil" id="hasil"></p>
    <div class="grid" id="produk"></div>
  </main>

</div>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/cari.js"></script>
</body>
</html>
