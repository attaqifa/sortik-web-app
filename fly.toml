# Konfigurasi Fly.io. Nama `app` harus sama dengan app yang sudah dibuat di dashboard Fly.io.
app = 'sortik'
primary_region = 'sin' # Singapura

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'   # mesin berhenti saat sepi (hemat biaya), nyala lagi saat ada request
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
