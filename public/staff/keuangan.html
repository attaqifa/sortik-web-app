<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="../assets/img/SortikLogo.jpeg">
  <title>Keuangan — SORTIK</title>
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body class="halaman-keuangan">
<div class="app">

  <aside class="side" id="side"></aside>

  <main>
    <header class="head">
      <h1>Keuangan</h1>
      <p>Pendapatan dari pesanan lunas, piutang, dan pengeluaran toko — hanya lihat, pencatatan oleh admin</p>
    </header>

    <section class="card">
      <h2>Ringkasan <span class="eksport" id="eksport"></span></h2>
      <div class="stats" id="stats"></div>
    </section>

    <section class="card">
      <h2>Arus Kas 6 Bulan Terakhir
        <span class="grafikleg"><span class="tag biru">Pendapatan</span><span class="tag abu">Pengeluaran</span></span>
      </h2>
      <p class="note">Pesanan lama tanpa tanggal pembayaran menggunakan tanggal pesanan sebagai perkiraan.</p>
      <div class="grafik" id="grafik"></div>
    </section>

    <section class="card">
      <h2>Arus Kas Terakhir</h2>
      <div class="chips" id="chips"></div>
      <div id="list"></div>
    </section>

    <!-- kartu catat pengeluaran: hanya untuk admin (dibuka dari keuangan.js) -->
    <section class="card" id="catat" hidden></section>
  </main>

</div>
<script src="../assets/vendor/jspdf.umd.min.js"></script>
<script src="../assets/vendor/jspdf.plugin.autotable.min.js"></script>
<script src="../assets/js/core/api.js"></script>
<script src="../assets/js/core/data.js"></script>
<script src="../assets/js/core/domain.js"></script>
<script src="../assets/js/core/ui.js"></script>
<script src="../assets/js/core/store.js"></script>
<script src="../assets/js/core/kelola.js"></script>
<script src="../assets/js/core/mulai.js" data-halaman="../assets/js/toko/keuangan.js"></script>
</body>
</html>
