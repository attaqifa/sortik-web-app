<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="../assets/img/SortikLogo.jpeg">
  <title>Kelola Pesanan — SORTIK</title>
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<div class="app">

  <aside class="side" id="side"></aside>

  <main>
    <header class="head">
      <h1>Kelola Pesanan</h1>
      <p>Antrean kerja: pesanan yang perlu ditindak ada di paling atas</p>
    </header>

    <section class="card pesanan">
      <div class="toolbar antrean">
        <input class="grow" type="search" id="cari" placeholder="Cari kode BK, nama pembeli, atau barang..." aria-label="Cari pesanan" autocomplete="off">
        <select id="bayar" aria-label="Saring pembayaran">
          <option value="">Semua pembayaran</option>
          <option value="belum">Belum dibayar</option>
          <option value="lunas">Lunas</option>
        </select>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Saring status pesanan"></div>
      <p class="hasil" id="hasil"></p>
      <div id="list"></div>
    </section>
  </main>

</div>
<script src="../assets/js/core/api.js"></script>
<script src="../assets/js/core/data.js"></script>
<script src="../assets/js/core/domain.js"></script>
<script src="../assets/js/core/ui.js"></script>
<script src="../assets/js/core/store.js"></script>
<script src="../assets/js/core/kelola.js"></script>
<script src="../assets/js/core/mulai.js" data-halaman="../assets/js/toko/pesanan.js"></script>
</body>
</html>
