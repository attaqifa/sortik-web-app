<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="../assets/img/SortikLogo.jpeg">
  <title>Cari Produk &amp; Rak — SORTIK</title>
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<div class="app">

  <aside class="side" id="side"></aside>

  <main>
    <header class="head">
      <h1>Cari Produk &amp; Rak</h1>
      <p>Temukan produk dan lokasi raknya</p>
    </header>

    <section class="card cari">
      <input type="search" id="q" placeholder="Cari produk..." autocomplete="off">
      <div class="chips" id="chips"></div>
      <div class="filteraktif" id="filter"></div>

      <details open>
        <summary>Denah Rak Toko</summary>
        <div class="denah" id="denah"></div>
        <p class="raklegenda"><span class="k">Kosong</span><span class="a">Ada barang</span><span class="o">Sedang dipilih</span></p>
      </details>
    </section>

    <!-- jumlah hasil + pilihan urutan -->
    <div class="barishasil">
      <p class="hasil" id="hasil"></p>
      <select id="urut" class="chartsaring" aria-label="Urutkan hasil">
        <option value="">Paling Relevan</option>
        <option value="laris">Paling Laris</option>
        <option value="murah">Harga Termurah</option>
        <option value="mahal">Harga Termahal</option>
      </select>
    </div>
    <div class="grid" id="produk"></div>
  </main>

</div>
<script src="../assets/js/core/api.js"></script>
<script src="../assets/js/core/data.js"></script>
<script src="../assets/js/core/domain.js"></script>
<script src="../assets/js/core/ui.js"></script>
<script src="../assets/js/core/store.js"></script>
<script src="../assets/js/core/kelola.js"></script>
<script src="../assets/js/core/mulai.js" data-halaman="../assets/js/user/cari.js"></script>
</body>
</html>
